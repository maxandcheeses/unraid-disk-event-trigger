name: Build and release plugin

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v2026.08.02)"
        required: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag/version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set plugin version
        run: |
          sed -i "s/<!ENTITY version   \".*\">/<!ENTITY version   \"${{ steps.ver.outputs.version }}\">/" unraid-disk-event-trigger.plg

      - name: Build package
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify build output
        run: |
          test -f unraid-disk-event-trigger.txz
          grep -q "${{ steps.ver.outputs.version }}" unraid-disk-event-trigger.plg
          grep -q "srcMD5" unraid-disk-event-trigger.plg

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            unraid-disk-event-trigger.txz
            unraid-disk-event-trigger.plg

      - name: Commit updated .plg back to main
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add unraid-disk-event-trigger.plg
          git diff --cached --quiet || git commit -m "chore: update plugin MD5/version for ${{ steps.ver.outputs.tag }}"
          git push origin HEAD:main
